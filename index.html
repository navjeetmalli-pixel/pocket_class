<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pocket Class India · Class 1–12 Study App</title>
  <meta name="description" content="Notes, flashcards, quizzes and mock tests for CBSE / NCERT and PSEB Classes 1 to 12, in every main subject. Works offline.">
  <meta name="theme-color" content="#5b5bd6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Pocket Class">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try {
      var saved = JSON.parse(localStorage.getItem("vidya:v1")) || {};
      if (saved.theme === "light" || saved.theme === "dark") document.documentElement.setAttribute("data-theme", saved.theme);
      if (saved.lang === "pa" || saved.lang === "hi") document.documentElement.lang = saved.lang;
    } catch (e) {}
  </script>
</head>
<body>
  <nav class="sidebar" id="sidebar" aria-label="Main"></nav>
  <main class="main" id="app"></main>
  <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
  <div id="toast" role="status" aria-live="polite"></div>

  <!-- Study content: the registry is loaded here; each class's files are loaded on demand. -->
  <script src="data/registry.js"></script>

  <!-- App -->
  <script src="js/util.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/store.js"></script>
  <script src="js/speech.js"></script>
  <script src="js/reminder.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/guided.js"></script>
  <script src="js/timer.js"></script>
  <script src="js/gen.js"></script>
  <script src="js/views.js"></script>
  <script src="js/sheets.js"></script>
  <script src="js/papers.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
